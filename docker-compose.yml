version: "3.8"

services:
  # ===========================================================================
  # Infraestructura de Respaldo Local (Postgres, Redpanda, Redis, LocalStack)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tiendita-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tiendita_admin
      POSTGRES_PASSWORD: tiendita_secret_local
      POSTGRES_DB: tiendita_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/cloud/000_common.sql:/docker-entrypoint-initdb.d/000_common.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendita_admin -d tiendita_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: tiendita-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'HEALTHY'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiendita-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0.0
    container_name: tiendita-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,kms,secretsmanager
      - DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstackdata:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"

  # ===========================================================================
  # Malla de Microservicios Cloud (BFF, Sync, DIAN y Dominio)
  # ===========================================================================
  bff-app:
    build:
      context: ./repos
      dockerfile: services/bff-app/Dockerfile
    container_name: tiendita-bff-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://tiendita_admin:tiendita_secret_local@postgres:5432/tiendita_dev
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  sync-service:
    build:
      context: ./repos
      dockerfile: services/sync-service/Dockerfile
