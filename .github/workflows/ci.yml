name: CI - TienditaOnline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Quality Rules (HU-002)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: repos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm lint

  test-ts:
    name: Unit & Integration Tests TS (HU-001, HU-003)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: repos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm test

  test-rust:
    name: Rust Domain & Clippy (HU-002, HU-003)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  contract-check:
    name: Contract Compatibility & RLS Schema Check (HU-008, HU-009, HU-469)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: repos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm contracts:check
      - run: pnpm db:verify

  semgrep:
    name: SAST Semgrep & Dependency Audit (HU-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript p/owasp-top-ten

  gitleaks:
    name: Secret Scanning Gitleaks & License Check (HU-003, HU-499)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: repos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
        working-directory: repos
      - run: pnpm build
        working-directory: repos
      - run: pnpm license:check
        working-directory: repos

  smoke-test:
    name: Post-Deploy Smoke Tests (HU-498)
    needs: [lint, test-ts, contract-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: repos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm smoke:test
